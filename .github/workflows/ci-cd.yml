name: CI/CD -> OpenShift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, cancelamos el anterior (no despliegues pisándose)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_NAME: devops-lab-openshift
  CHART_PATH: ./helm/devops-lab-openshift

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: CI - install & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------- BUILD
  build:
    name: Build & push image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # necesario para hacer push a ghcr.io con GITHUB_TOKEN
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas y el repo es "Medinawhite/..."
      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (y push solo si no es PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- CD
  deploy:
    name: Deploy to OpenShift (dev)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev            # Settings > Environments: aquí podrías añadir aprobación manual
    steps:
      - uses: actions/checkout@v4

      - name: Install oc and helm
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"
          helm: "3"

      - name: Login to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_NAMESPACE }}

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "${{ vars.OPENSHIFT_NAMESPACE }}" \
            --set image.repository="${{ needs.build.outputs.image }}" \
            --set image.tag="${{ github.sha }}" \
            --wait --atomic --timeout 3m

      - name: Smoke test
        run: |
          HOST=$(oc get route "$RELEASE_NAME" -o jsonpath='{.spec.host}')
          echo "Route: https://$HOST"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://$HOST/health"
          curl -fsS "https://$HOST/" | grep "${{ github.sha }}"

      # Si algo falla, dejamos en el log lo que mirarías a mano
      - name: Debug info on failure
        if: failure()
        run: |
          oc get pods -l app="$RELEASE_NAME" -o wide || true
          oc describe pods -l app="$RELEASE_NAME" | tail -n 40 || true
          oc logs -l app="$RELEASE_NAME" --tail=50 --all-containers || true
          oc get events --sort-by=.lastTimestamp | tail -n 20 || true
          helm history "$RELEASE_NAME" || true
