{{- if .Values.route.enabled }}
# Route: el objeto propio de OpenShift para exponer un Service fuera del cluster
# (equivalente a un Ingress en Kubernetes "vanilla").
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Release.Name }}
  port:
    targetPort: http
  tls:
    termination: edge                       # TLS termina en el router de OpenShift
    insecureEdgeTerminationPolicy: Redirect # http -> https
{{- end }}
